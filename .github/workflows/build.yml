name: Build APK

on:
  push:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Delete old release if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-build --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push --delete origin latest-build 2>/dev/null || true

      - name: Publish APK as Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-build \
            --repo ${{ github.repository }} \
            --title "Service Reminder – Aktuelle APK" \
            --notes "Automatisch gebaute Debug-APK. Einfach herunterladen und installieren." \
            --prerelease \
            app/build/outputs/apk/debug/app-debug.apk#ServiceReminder.apk
